name: obgaid_app
description: "ObgAid — Obstetrics & Gynaecology Clinical Reference"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Health Icons (healthicons.org), CC0 public domain. Obstetric and
    # gynaecological glyphs Material has no equivalent for — pregnant abdomen,
    # fetus, IUD, speculum, sonogram. Every file uses fill="currentColor" so
    # they tint to the theme like a Material icon does.
    - assets/icons/

    # Original line illustrations, one per learning curriculum area. Drawn
    # for this app, not adapted from anywhere. Linework is currentColor so it
    # follows the theme; the clay accent is a literal so it survives.
    - assets/learning/
